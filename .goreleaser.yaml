# GoReleaser configuration for outsystems-cli.
# Schema: https://goreleaser.com — run `goreleaser check` to validate.
version: 2

project_name: outsystems-cli

before:
  hooks:
    # Keep the module tidy and ensure everything compiles before releasing.
    - go mod tidy
    - go test ./...

builds:
  - id: outsystems-cli
    main: .
    binary: outsystems-cli
    env:
      - CGO_ENABLED=0
    # Inject build metadata into main.{version,commit,date}; -s -w strips the
    # symbol table and DWARF to shrink the binary.
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Windows on arm64 is uncommon; drop it to keep the matrix lean.
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: outsystems-cli
    # tar.gz everywhere, zip on Windows (friendlier for Windows users).
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"

# Publish a Homebrew cask to a personal tap repo (github.com/jinjie/homebrew-tap).
# On each release, GoReleaser commits an updated cask pointing at the new
# archives + checksums, so users can `brew install jinjie/tap/outsystems-cli`.
# (GoReleaser's `brews`/formula publisher is deprecated in favor of casks.)
homebrew_casks:
  - name: outsystems-cli
    repository:
      owner: jinjie
      name: homebrew-tap
      branch: main
      # Cross-repo push needs a token with write access to the tap repo; the
      # default GITHUB_TOKEN cannot push to another repository.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    # Directory within the tap repo to place the cask.
    directory: Casks
    homepage: "https://github.com/jinjie/outsystems-cli"
    description: "CLI for the OutSystems LifeTime REST API v2"
    license: "MIT"
    # Commit author for the cask update in the tap repo.
    commit_author:
      name: goreleaserbot
      email: goreleaserbot@users.noreply.github.com
    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"
    # Only publish the cask for real (non-prerelease) tags.
    skip_upload: auto
    # The binary is unsigned, so strip the macOS quarantine attribute on
    # install to avoid a Gatekeeper "cannot be opened" prompt. Uses GoReleaser's
    # declarative install_steps (v2.19+): {{ .StagedPath }} is a GoReleaser
    # template var, and `run` is Homebrew's declarative step command.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/outsystems-cli"]
          end

snapshot:
  # Version used for `goreleaser release --snapshot` (no tag required).
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "merge conflict"
      - Merge pull request
      - Merge branch

release:
  # Set to true if you want releases created as drafts for manual review.
  draft: false
  prerelease: auto
