site_name: OutSystems LifeTime v2 CLI
site_description: A command-line interface for the OutSystems LifeTime REST API v2.
site_author: Kong Jin Jie
repo_name: jinjie/outsystems-cli
repo_url: https://github.com/jinjie/outsystems-cli
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Configuration: configuration.md
  - Usage: usage.md
  - Downloading binaries: downloads.md
  - Command reference: commands/index.md
  - Development: development.md
  - Releases: releases.md

# The per-command pages under commands/ are generated by `go run ./tools/gendocs`
# and linked from commands/index.md and each command's "SEE ALSO" section, so
# they are intentionally kept out of the top-level nav.
not_in_nav: |
  /commands/outsystems-cli*.md
